<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Luanti</title><style>body,html{width:100%;height:100%;margin:0;background:#101418;color:#fff}body{display:grid;place-items:center;font:14px system-ui,sans-serif;overflow:hidden}#canvas{width:100%;height:100%;border:0;outline:0}#luanti-network{position:fixed;z-index:3;top:12px;left:12px;max-width:min(34rem,calc(100% - 24px));padding:8px 12px;border-radius:6px;background:rgba(10,14,18,.88)}#luanti-proxy-form{display:flex;gap:6px;margin-top:6px}#luanti-proxy-url{min-width:16rem}#luanti-network-error{margin-top:6px;color:#ffd5d5}#luanti-persistence{position:fixed;z-index:2;top:12px;right:12px;max-width:min(34rem,calc(100% - 24px))}#luanti-persistence-error,#luanti-persistence-status{padding:8px 12px;border-radius:6px;background:rgba(10,14,18,.88)}#luanti-persistence-status[data-state=saved]{color:#a6e3a1}#luanti-persistence-error{margin-top:8px;color:#ffd5d5;background:#6c2020;white-space:pre-wrap}</style></head><body><div id=luanti-network><div id=luanti-network-status role=status aria-live=polite>Multiplayer proxy disabled</div><form id=luanti-proxy-form><label for=luanti-proxy-url>Proxy</label> <input id=luanti-proxy-url inputmode=url placeholder=wss://proxy.example.org/ type=url> <button type=submit>Apply</button></form><div id=luanti-network-error role=alert hidden></div></div><div id=luanti-persistence role=status aria-live=polite><div id=luanti-persistence-status data-state=loading>Loading saved data…</div><div id=luanti-persistence-error role=alert hidden></div></div><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><script>var Module={canvas:document.getElementById("canvas"),printErr:function(n){console.error(n)}}</script><script async src=luanti.js></script></body></html>
