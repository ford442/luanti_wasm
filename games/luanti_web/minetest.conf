# Game defaults for the Luanti web showcase.
#
# The engine loads this file as the game settings layer: it overrides the
# engine defaults for worlds of this game only, and it is never written back
# to the user's own minetest.conf.

# Freeze the clock so the galleries look the same on every visit. The theater
# remote is the only thing that moves it (see lw_theater).
time_speed = 0

# The spawn plaza, just south of the fountain and facing the gate. Mirrors
# SPAWN in mods/lw_world/init.lua, which warns at load time if they diverge.
static_spawnpoint = 0,10,-14
