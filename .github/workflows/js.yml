name: js

# Lint, type-check and unit-test the browser-side JavaScript (client/web) and
# the WebSocket proxy (util/wasm/proxy). No Emscripten build needed.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/js.yml'
      - 'client/web/**'
      - 'util/wasm/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/js.yml'
      - 'client/web/**'
      - 'util/wasm/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ESLint, tsc and proxy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Luanti
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            util/wasm/proxy/package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Install proxy dependencies
        run: npm run proxy:install

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Proxy tests
        run: npm test
